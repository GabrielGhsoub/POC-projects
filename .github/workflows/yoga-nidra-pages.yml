name: Yoga Nidra – deploy PWA to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ["yoga-nidra-app/www/**", ".github/workflows/yoga-nidra-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yoga-nidra-app/www
      - id: deployment
        uses: actions/deploy-pages@v4
