name: Yoga Nidra – build Android APK

on:
  push:
    branches: [main, master]
    paths: ["yoga-nidra-app/**", ".github/workflows/yoga-nidra-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yoga-nidra-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set);
      # just make sure the pieces Capacitor's Gradle build needs are present.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yoga-nidra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yoga-nidra-apk
          path: yoga-nidra-app/yoga-nidra.apk

      # A GitHub Release is the easiest thing to open from a phone browser:
      # one tap on the .apk and Android installs it.
      - name: Publish as "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yoga-nidra-latest
          name: Yoga Nidra – latest APK
          body: Debug build of the Yoga Nidra app. Download on your phone and open the file to install.
          files: yoga-nidra-app/yoga-nidra.apk
          prerelease: true
